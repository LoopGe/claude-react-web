<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>新消息弹入动画 — 预览</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-elev: #15181f;
    --bg-elev-2: #1c2029;
    --border: #262b36;
    --fg: #e6e8eb;
    --fg-muted: #8c94a3;
    --accent: #7b8cde;
    --accent-strong: #5b6fc7;
    --on-accent: #ffffff;
    --msg-user-bg: color-mix(in srgb, var(--accent) 28%, var(--bg));
    --msg-user-border: color-mix(in srgb, var(--accent) 50%, var(--bg));
    --msg-user-header-fg: color-mix(in srgb, var(--accent) 75%, var(--fg));
    --assistant-header-fg: #a9b4d6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ---------- Toolbar ---------- */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
  }

  .toolbar h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    margin-right: 8px;
  }

  .group {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .group-label {
    font-size: 12px;
    color: var(--fg-muted);
    margin-right: 4px;
  }

  button {
    font-family: inherit;
    font-size: 13px;
    color: var(--fg);
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: var(--bg-elev-2); }

  .seg-btn.active {
    background: var(--accent-strong);
    border-color: var(--accent);
    color: var(--on-accent);
  }

  .primary {
    background: var(--accent-strong);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  .primary:hover { background: var(--accent); }

  .hint {
    font-size: 12px;
    color: var(--fg-muted);
  }
  .hint code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    background: var(--bg-elev-2);
    padding: 1px 5px;
    border-radius: 4px;
    color: var(--fg);
  }

  /* ---------- Chat area ---------- */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px max(20px, calc((100% - 760px) / 2));
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ---------- Message bubbles (复刻真实 UI) ---------- */
  .msg {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    background: var(--bg-elev);
    max-width: 100%;
  }

  .msg.user {
    align-self: flex-end;
    width: auto;
    max-width: min(480px, 85%);
    background: var(--msg-user-bg);
    border-color: var(--msg-user-border);
    color: var(--fg);
    border-bottom-right-radius: 3px;
  }
  .msg.user .msg-header { color: var(--msg-user-header-fg); }

  .msg.assistant {
    align-self: flex-start;
    width: auto;
    max-width: min(640px, 100%);
    background: var(--bg-elev);
    border-bottom-left-radius: 3px;
  }
  .msg.assistant .msg-header { color: var(--assistant-header-fg); }
  .msg.assistant .msg-header::before { content: '✦ '; }

  .msg-header {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 4px;
    letter-spacing: 0.02em;
  }
  .msg-body { color: var(--fg); }
  .msg-body p { margin: 0; }
  .msg-body p + p { margin-top: 6px; }

  /* ================================================== */
  /*  入场动画方案                                       */
  /*  通过 body[data-anim="X"] 切换；新消息加 .msg-enter */
  /* ================================================== */

  /* 默认（不在过渡过程中）不影响布局 */

  /* ---- A. Fade + Slide Up ---- */
  body[data-anim="A"] .msg-enter {
    animation: animA 280ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes animA {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---- B. Scale Pop (轻微 overshoot) ---- */
  body[data-anim="B"] .msg-enter {
    animation: animB 360ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
    transform-origin: bottom center;
  }
  @keyframes animB {
    from { opacity: 0; transform: scale(0.92); }
    60%  { opacity: 1; }
    to   { opacity: 1; transform: scale(1); }
  }

  /* ---- C. Slide From Side (按对齐方向) ---- */
  body[data-anim="C"] .msg.user.msg-enter {
    animation: animC-right 320ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  body[data-anim="C"] .msg.assistant.msg-enter {
    animation: animC-left 320ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes animC-right {
    from { opacity: 0; transform: translateX(28px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes animC-left {
    from { opacity: 0; transform: translateX(-28px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ---- D. Blur + Rise ---- */
  body[data-anim="D"] .msg-enter {
    animation: animD 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes animD {
    from { opacity: 0; transform: translateY(10px); filter: blur(6px); }
    to   { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  /* 可访问性：尊重系统"减少动态效果"设置 */
  @media (prefers-reduced-motion: reduce) {
    .msg-enter { animation: none !important; }
  }

  /* ---------- 当前方案说明卡片 ---------- */
  .spec {
    margin: 0 max(20px, calc((100% - 760px) / 2));
    margin-bottom: 18px;
    font-size: 12px;
    color: var(--fg-muted);
    border-top: 1px dashed var(--border);
    padding-top: 10px;
  }
  .spec code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    background: var(--bg-elev-2);
    padding: 1px 5px;
    border-radius: 4px;
    color: var(--fg);
  }
</style>
</head>
<body data-anim="A">

  <div class="toolbar">
    <h1>新消息弹入动画</h1>

    <div class="group">
      <span class="group-label">方案</span>
      <button class="seg-btn active" data-set="A">A · 上滑淡入</button>
      <button class="seg-btn" data-set="B">B · 弹性放大</button>
      <button class="seg-btn" data-set="C">C · 侧向滑入</button>
      <button class="seg-btn" data-set="D">D · 模糊上浮</button>
    </div>

    <div class="group">
      <button id="send" class="primary">＋ 发送一条消息</button>
      <button id="replay">↻ 重放全部</button>
    </div>

    <span class="hint">提示：切换方案后点 <code>发送</code> 或 <code>重放</code> 查看效果</span>
  </div>

  <div class="chat" id="chat"></div>

  <div class="spec" id="spec"></div>

<script>
  const chat = document.getElementById('chat');
  const spec = document.getElementById('spec');
  const body = document.body;

  const SPECS = {
    A: '方案 A · 上滑淡入 — <code>opacity 0→1</code> + <code>translateY(12px→0)</code>，280ms <code>cubic-bezier(0.22, 1, 0.36, 1)</code>。克制顺滑，推荐做默认。',
    B: '方案 B · 弹性放大 — <code>scale(0.92→1)</code> + 淡入，360ms <code>cubic-bezier(0.34, 1.56, 0.64, 1)</code>（轻微 overshoot）。更有"弹"的感觉。',
    C: '方案 C · 侧向滑入 — 用户气泡从右 <code>translateX(28px→0)</code>、助手气泡从左 <code>translateX(-28px→0)</code>，320ms。贴合左右对齐语义。',
    D: '方案 D · 模糊上浮 — <code>blur(6px→0)</code> + <code>translateY(10px→0)</code> + 淡入，420ms。柔和高级感。',
  };

  function updateSpec() {
    spec.innerHTML = SPECS[body.dataset.anim] + ' &nbsp;|&nbsp; 全部方案均带 <code>prefers-reduced-motion</code> 兜底。';
  }

  // 模拟对话内容
  const SAMPLES = [
    { role: 'user', text: '帮我把消息列表加一个弹入动画。' },
    { role: 'assistant', text: '好的，我做几种方案供你挑选：上滑淡入、弹性放大、侧向滑入、模糊上浮。' },
    { role: 'user', text: '先看 HTML 预览。' },
    { role: 'assistant', text: '已生成独立预览文件，切换顶部按钮即可实时对比每种入场效果。' },
    { role: 'user', text: '这个弹性的感觉不错。' },
    { role: 'assistant', text: '收到 ✦ 选定后我再接入真实组件。' },
  ];

  let idx = 0;

  function makeMsg(role, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + role + ' msg-enter';
    const header = document.createElement('div');
    header.className = 'msg-header';
    header.textContent = role === 'user' ? 'you' : 'assistant';
    const bodyEl = document.createElement('div');
    bodyEl.className = 'msg-body';
    const p = document.createElement('p');
    p.textContent = text;
    bodyEl.appendChild(p);
    el.appendChild(header);
    el.appendChild(bodyEl);
    // 动画播完后移除 msg-enter，模拟真实场景中"只播一次"
    el.addEventListener('animationend', () => el.classList.remove('msg-enter'), { once: true });
    return el;
  }

  function appendOne() {
    const s = SAMPLES[idx % SAMPLES.length];
    idx++;
    const el = makeMsg(s.role, s.text);
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
  }

  function replayAll() {
    chat.innerHTML = '';
    idx = 0;
    let i = 0;
    const timer = setInterval(() => {
      appendOne();
      i++;
      if (i >= SAMPLES.length) clearInterval(timer);
    }, 260);
  }

  // 方案切换
  document.querySelectorAll('.seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      body.dataset.anim = btn.dataset.set;
      updateSpec();
    });
  });

  document.getElementById('send').addEventListener('click', appendOne);
  document.getElementById('replay').addEventListener('click', replayAll);

  // 初始化
  updateSpec();
  replayAll();
</script>
</body>
</html>
